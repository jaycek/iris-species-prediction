<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Flower Predictor</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="container">

        <section class="prediction-card">

            <div class="header">
                

                <h1>Iris Flower Predictor</h1>

                <p class="subtitle">
                    Discover the species of an Iris flower
                    using its measurements.
                </p>
            </div>

            <form method="POST" class="prediction-form">

                <div class="form-group">
                    <label for="sepal_length">Sepal Length (cm)</label>
                    <input
                        type="number"
                        step="any"
                        min="0"
                        id="sepal_length"
                        name="sepal_length"
                        placeholder="Example: 5.1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="sepal_width">Sepal Width (cm)</label>
                    <input
                        type="number"
                        step="any"
                        min="0"
                        id="sepal_width"
                        name="sepal_width"
                        placeholder="Example: 3.5"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="petal_length">Petal Length (cm)</label>
                    <input
                        type="number"
                        step="any"
                        min="0"
                        id="petal_length"
                        name="petal_length"
                        placeholder="Example: 1.4"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="petal_width">Petal Width (cm)</label>
                    <input
                        type="number"
                        step="any"
                        min="0"
                        id="petal_width"
                        name="petal_width"
                        placeholder="Example: 0.2"
                        required
                    >
                </div>

                <button type="submit">
                    Predict Flower
                </button>

            </form>

            {% if prediction %}

                <div class="result">

                    <p class="result-label">
                        YOUR PREDICTION
                    </p>

                    <h2>{{ prediction | title }}</h2>

                    <img
                        src="{{ url_for('static', filename=flower_image) }}"
                        alt="{{ prediction }} Iris flower"
                        class="flower-image"
                    >

                    <p class="result-description">
                        Based on the measurements entered,
                        the model predicts this Iris species.
                    </p>

                </div>

            {% endif %}

            

        </section>

    </main>

</body>
</html>
